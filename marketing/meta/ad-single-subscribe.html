<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse 80% 60% at 100% 0%, #ff8a33 0%, transparent 42%),
        radial-gradient(ellipse 70% 55% at -5% 100%, #1447a8 0%, transparent 48%),
        linear-gradient(155deg, #061833 0%, #0b3d91 48%, #082a66 100%);
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 58%, rgba(255, 106, 0, 0.22) 58%, rgba(255, 106, 0, 0.22) 62%, transparent 62%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 52px 52px 0;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand svg { width: 58px; height: 58px; display: block; }
    .brand span {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.045em;
      color: #ffffff;
    }
    .hook {
      margin-top: 40px;
      display: flex;
      align-items: flex-end;
      gap: 28px;
    }
    .hook .big {
      font-size: 220px;
      line-height: 0.85;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: #ff6a00;
      text-shadow: 0 10px 0 rgba(0, 0, 0, 0.18);
    }
    .hook .side {
      padding-bottom: 18px;
      max-width: 360px;
    }
    .hook .side strong {
      display: block;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }
    .hook .side span {
      display: block;
      margin-top: 12px;
      font-size: 24px;
      line-height: 1.3;
      color: #c9d8ef;
      font-weight: 600;
    }
    h1 {
      margin-top: 36px;
      font-size: 54px;
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 800;
      max-width: 980px;
      color: #ffffff;
    }
    .cost {
      margin-top: 22px;
      display: inline-flex;
      align-items: baseline;
      gap: 14px;
      background: #ff6a00;
      color: #fff;
      padding: 16px 22px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .cost b {
      font-size: 40px;
      line-height: 1;
    }
    .cost span {
      font-size: 22px;
      opacity: 0.95;
      font-weight: 700;
    }
    .cta {
      margin-top: auto;
      height: 120px;
      margin-left: -52px;
      margin-right: -52px;
      background: #ff6a00;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 1.7 20.6 5.3v6.7c0 4.8-3.5 8.2-8.6 9.9-5.1-1.7-8.6-5.1-8.6-9.9V5.3L12 1.7Z" fill="#ffffff"/>
        <path d="M8.6 7.4v8.1l2.1-1.8 1.7 3.3 1.4-.7-1.7-3.3 2.6-.3L8.6 7.4Z" fill="#0b3d91"/>
        <path d="M7.4 16.2 15.8 8" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>AnodeH</span>
    </div>
    <div class="hook">
      <div class="big">18%</div>
      <div class="side">
        <strong>of ad clicks were never going to buy</strong>
        <span>Datacenter · VPN · repeat IPs · instant bounces</span>
      </div>
    </div>
    <h1>Stop invalid Google Ads traffic from burning your budget.</h1>
    <div class="cost"><b>R1 084</b><span>wasted in a sample week</span></div>
    <div class="cta">Subscribe · 7-day free trial</div>
  </div>
</body>
</html>
