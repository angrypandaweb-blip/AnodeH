<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse 70% 55% at 12% 8%, #ffffff 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 92% 14%, #fff1e6 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 70% 88%, #dce8f8 0%, transparent 55%),
        linear-gradient(165deg, #f8fafc 0%, #eef3f9 52%, #e4edf7 100%);
      color: #142033;
      position: relative;
    }
    .wrap {
      height: 100%;
      padding: 56px 56px 0;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand svg { width: 52px; height: 52px; display: block; }
    .brand span {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #0b3d91;
    }
    h1 {
      margin-top: 44px;
      font-size: 62px;
      line-height: 1.06;
      letter-spacing: -0.045em;
      font-weight: 700;
      max-width: 940px;
      color: #142033;
    }
    .lede {
      margin-top: 18px;
      font-size: 26px;
      line-height: 1.35;
      color: #5c6b7c;
      max-width: 880px;
    }
    .panel {
      margin-top: 40px;
      background: #fff;
      border: 1px solid #e3ebf4;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(11, 61, 145, 0.07);
      padding: 32px 36px 34px;
      width: 100%;
    }
    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      color: #5c6b7c;
      font-size: 20px;
      font-weight: 600;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .metric label {
      display: block;
      font-size: 18px;
      color: #5c6b7c;
      margin-bottom: 8px;
    }
    .metric strong {
      display: block;
      font-size: 54px;
      letter-spacing: -0.04em;
      color: #ff6a00;
      line-height: 1;
    }
    .metric em {
      display: block;
      margin-top: 10px;
      font-style: normal;
      color: #5c6b7c;
      font-size: 20px;
    }
    .bar {
      margin-top: 14px;
      height: 10px;
      border-radius: 99px;
      background: #fff1e6;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      width: 18%;
      height: 100%;
      background: #ff6a00;
    }
    .cta {
      margin-top: auto;
      height: 112px;
      margin-left: -56px;
      margin-right: -56px;
      background: #ff6a00;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 1.7 20.6 5.3v6.7c0 4.8-3.5 8.2-8.6 9.9-5.1-1.7-8.6-5.1-8.6-9.9V5.3L12 1.7Z" fill="#0b3d91"/>
        <path d="M8.6 7.4v8.1l2.1-1.8 1.7 3.3 1.4-.7-1.7-3.3 2.6-.3L8.6 7.4Z" fill="#ffffff"/>
        <path d="M7.4 16.2 15.8 8" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>AnodeH</span>
    </div>
    <h1>Block the clicks that were never going to buy.</h1>
    <p class="lede">Google Ads click protection that scores invalid traffic and writes the exclusions for you.</p>
    <div class="panel">
      <div class="panel-top"><span>Invalid traffic overview</span><span>Last 7 days</span></div>
      <div class="metrics">
        <div class="metric">
          <label>Invalid rate</label>
          <strong>18%</strong>
          <div class="bar"><i></i></div>
          <em>231 flagged or blocked</em>
        </div>
        <div class="metric">
          <label>Estimated invalid cost</label>
          <strong>R1 084</strong>
          <em>of R7 908 estimated spend</em>
        </div>
      </div>
    </div>
    <div class="cta">Subscribe · 7-day free trial</div>
  </div>
</body>
</html>
