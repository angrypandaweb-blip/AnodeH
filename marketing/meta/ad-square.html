<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Inter";
      src: local("Inter"), local("Segoe UI"), local("Helvetica Neue"), local("Arial");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, #ffffff 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, #fff1e6 0%, transparent 36%),
        linear-gradient(160deg, #f7fafc 0%, #eef3f9 48%, #e7eef9 100%);
      color: #142033;
      position: relative;
    }
    .wrap {
      height: 100%;
      padding: 64px 64px 0;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand svg { width: 54px; height: 54px; display: block; }
    .brand span {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #0b3d91;
    }
    h1 {
      margin-top: 54px;
      font-size: 64px;
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 700;
      max-width: 920px;
    }
    .lede {
      margin-top: 22px;
      font-size: 28px;
      line-height: 1.35;
      color: #5c6b7c;
      max-width: 860px;
    }
    .card {
      margin-top: 48px;
      background: #fff;
      border: 1px solid #e3ebf4;
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(11, 61, 145, 0.08);
      padding: 36px 40px 40px;
      width: 100%;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      color: #5c6b7c;
      font-size: 22px;
      font-weight: 600;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .metric label {
      display: block;
      font-size: 20px;
      color: #5c6b7c;
      margin-bottom: 8px;
    }
    .metric strong {
      display: block;
      font-size: 56px;
      letter-spacing: -0.04em;
      color: #ff6a00;
      line-height: 1;
    }
    .metric em {
      display: block;
      margin-top: 10px;
      font-style: normal;
      color: #5c6b7c;
      font-size: 22px;
    }
    .bar {
      margin-top: 18px;
      height: 12px;
      border-radius: 99px;
      background: #fff1e6;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      width: 18%;
      height: 100%;
      background: #ff6a00;
    }
    .cta {
      margin-top: auto;
      height: 118px;
      margin-left: -64px;
      margin-right: -64px;
      background: #ff6a00;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 1.7 20.6 5.3v6.7c0 4.8-3.5 8.2-8.6 9.9-5.1-1.7-8.6-5.1-8.6-9.9V5.3L12 1.7Z" fill="#0b3d91"/>
        <path d="M8.6 7.4v8.1l2.1-1.8 1.7 3.3 1.4-.7-1.7-3.3 2.6-.3L8.6 7.4Z" fill="#ffffff"/>
        <path d="M7.4 16.2 15.8 8" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>AnodeH</span>
    </div>
    <h1>Block the clicks that were never going to buy.</h1>
    <p class="lede">Stop invalid Google Ads traffic from burning your budget.</p>
    <div class="card">
      <div class="card-top"><span>Invalid traffic overview</span><span>Last 7 days</span></div>
      <div class="metrics">
        <div class="metric">
          <label>Invalid rate</label>
          <strong>18%</strong>
          <div class="bar"><i></i></div>
          <em>231 flagged or blocked</em>
        </div>
        <div class="metric">
          <label>Estimated invalid cost</label>
          <strong>R1 084</strong>
          <em>of R7 908 estimated spend</em>
        </div>
      </div>
    </div>
    <div class="cta">7-day free trial · anodeh.com</div>
  </div>
</body>
</html>
